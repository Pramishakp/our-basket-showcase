<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="420" viewBox="0 0 1100 420" role="img" aria-labelledby="title description">
  <title id="title">Our Basket offline-first architecture</title>
  <desc id="description">The React Native application writes to local storage and an offline action queue, which synchronizes through Firebase Authentication and Cloud Firestore when online.</desc>
  <rect width="1100" height="420" rx="32" fill="#F7F8F6"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="550" y="50" text-anchor="middle" font-size="26" font-weight="700" fill="#1F2D25">Offline-first household architecture</text>

    <rect x="55" y="118" width="235" height="190" rx="24" fill="#FFFFFF" stroke="#C9D8CF" stroke-width="2"/>
    <circle cx="172" cy="167" r="29" fill="#E5F0E8"/>
    <path d="M157 168h30M163 157h18M163 179h18" stroke="#527462" stroke-width="4" stroke-linecap="round"/>
    <text x="172" y="223" text-anchor="middle" font-size="20" font-weight="700" fill="#2F4035">React Native app</text>
    <text x="172" y="253" text-anchor="middle" font-size="14" fill="#66756C">Shopping · History · Reports</text>
    <text x="172" y="278" text-anchor="middle" font-size="14" fill="#66756C">Accessible mobile interface</text>

    <rect x="430" y="90" width="240" height="120" rx="22" fill="#EAF2ED" stroke="#BFD2C5" stroke-width="2"/>
    <text x="550" y="137" text-anchor="middle" font-size="19" font-weight="700" fill="#355A45">Local device storage</text>
    <text x="550" y="167" text-anchor="middle" font-size="14" fill="#5F7065">Cached household data</text>
    <text x="550" y="190" text-anchor="middle" font-size="14" fill="#5F7065">Offline action queue</text>

    <rect x="430" y="245" width="240" height="100" rx="22" fill="#F8EDDE" stroke="#E5CFAD" stroke-width="2"/>
    <text x="550" y="286" text-anchor="middle" font-size="19" font-weight="700" fill="#785D35">Sync controller</text>
    <text x="550" y="316" text-anchor="middle" font-size="14" fill="#7C6B51">Retry · conflict handling · status</text>

    <rect x="810" y="90" width="235" height="120" rx="22" fill="#EDF2F7" stroke="#C7D4DF" stroke-width="2"/>
    <text x="927" y="137" text-anchor="middle" font-size="19" font-weight="700" fill="#405A70">Firebase Authentication</text>
    <text x="927" y="167" text-anchor="middle" font-size="14" fill="#607587">Anonymous and email accounts</text>
    <text x="927" y="190" text-anchor="middle" font-size="14" fill="#607587">Household membership</text>

    <rect x="810" y="245" width="235" height="100" rx="22" fill="#E8F2EF" stroke="#BFD5CE" stroke-width="2"/>
    <text x="927" y="286" text-anchor="middle" font-size="19" font-weight="700" fill="#37645A">Cloud Firestore</text>
    <text x="927" y="316" text-anchor="middle" font-size="14" fill="#5E776F">Shared household data and rules</text>

    <g stroke="#789486" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M290 173h120"/>
      <path d="M400 164l10 9-10 9"/>
      <path d="M550 210v35"/>
      <path d="M541 235l9 10 9-10"/>
      <path d="M670 295h120"/>
      <path d="M780 286l10 9-10 9"/>
      <path d="M927 210v35"/>
    </g>
    <text x="350" y="156" text-anchor="middle" font-size="12" font-weight="700" fill="#698075">Instant local updates</text>
    <text x="730" y="278" text-anchor="middle" font-size="12" font-weight="700" fill="#698075">When online</text>
  </g>
</svg>
